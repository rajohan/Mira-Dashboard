[install]
peer = false

[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    "scripts/**",
    "src/**/*.d.ts",
    "src/**/testSupport/**",
    "src/server/test/**",
    "src/test/**",
]

[serve.static]
plugins = ["./scripts/reactCompilerPlugin.ts", "bun-plugin-tailwind"]
environment = "PUBLIC_*"
