name: Dashboard checks

on:
    pull_request: {}
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    dashboard-static-checks:
        name: dashboard-static-checks
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check source boundaries
              run: bun run check:boundaries

            - name: Type-check all source and tests
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Check formatting
              run: bun run format:check

            - name: Verify generated documentation
              run: bun run docs:check

            - name: Verify migration graph
              run: bun run db:check

    dashboard-coverage:
        name: coverage-${{ matrix.partition }}
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                partition: [bun, browser, storybook]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install Chromium
              if: ${{ matrix.partition == 'storybook' }}
              run: bun run storybook:install-browser

            - name: Test ${{ matrix.partition }} coverage
              run: bun run test:coverage:${{ matrix.partition }}

            - name: Upload ${{ matrix.partition }} coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: dashboard-coverage-${{ matrix.partition }}-lcov
                  path: |
                      coverage/${{ matrix.partition }}-001/lcov.info
                      coverage/${{ matrix.partition }}-002/lcov.info
                      coverage/${{ matrix.partition }}-003/lcov.info
                  if-no-files-found: error
                  retention-days: 14

    dashboard-checks:
        name: dashboard-checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [dashboard-static-checks, dashboard-coverage]
        if: ${{ always() }}
        env:
            CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
        steps:
            - name: Require static checks and every coverage partition
              env:
                  COVERAGE_MATRIX_RESULT: ${{ needs['dashboard-coverage'].result }}
                  STATIC_CHECKS_RESULT: ${{ needs['dashboard-static-checks'].result }}
              run: |
                  test "${STATIC_CHECKS_RESULT}" = "success"
                  test "${COVERAGE_MATRIX_RESULT}" = "success"

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Download Bun coverage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dashboard-coverage-bun-lcov
                  path: coverage

            - name: Download browser coverage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dashboard-coverage-browser-lcov
                  path: coverage

            - name: Download Storybook coverage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dashboard-coverage-storybook-lcov
                  path: coverage

            - name: Merge and verify coverage
              run: bun run test:coverage:merge

            - name: Upload coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: dashboard-coverage-lcov
                  path: coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: ${{ env.CODECOV_TOKEN_PRESENT == 'true' }}
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  files: coverage/lcov.info
                  flags: dashboard
                  name: dashboard
                  fail_ci_if_error: true

    storybook:
        name: storybook
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build Storybook
              run: bun run build:storybook
