version: 2

# The `bun` package-ecosystem entry is intentionally absent. Dependabot's bun
# updater rejects bun.lock "lockfileVersion": 2 (written by Bun >= 1.3; this
# repository pins Bun 1.4.0 via .bun-version), so every weekly scheduled run
# failed with "Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock" and
# produced no update PRs. Re-add the `bun` ecosystem entry once Dependabot
# supports bun.lock lockfileVersion 2. The github-actions ecosystem below is
# unaffected.
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:30"
          timezone: "Europe/Oslo"
      open-pull-requests-limit: 4
      labels:
          - "type: dependencies"
          - "area: ci"
      commit-message:
          prefix: "ci(deps)"
      groups:
          github-actions-major:
              patterns:
                  - "*"
              update-types:
                  - "major"
          github-actions-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
