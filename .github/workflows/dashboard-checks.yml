name: Dashboard checks

on:
    pull_request: {}
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend-checks:
        name: frontend-checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Isolate the future root from legacy checks
              run: mv greenfield "${RUNNER_TEMP}/mira-dashboard-greenfield"

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint repository
              run: bun run lint

            - name: Check repository formatting
              run: bun run format:check

            - name: Build frontend
              run: bun run build:frontend

            - name: Test frontend coverage
              run: bun run test:frontend:coverage

            - name: Upload frontend coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: frontend-coverage-lcov
                  path: coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload frontend coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: ${{ env.CODECOV_TOKEN_PRESENT == 'true' }}
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  files: coverage/lcov.info
                  flags: frontend
                  name: frontend
                  fail_ci_if_error: true

    backend-checks:
        name: backend-checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Isolate the future root from legacy checks
              run: mv greenfield "${RUNNER_TEMP}/mira-dashboard-greenfield"

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build backend
              run: bun run build:backend

            - name: Test backend coverage
              run: bun run test:backend:coverage

            - name: Prefix backend LCOV paths
              if: always()
              run: test ! -f backend/coverage/lcov.info || perl -0pi -e 's{^SF:src/}{SF:backend/src/}mg' backend/coverage/lcov.info

            - name: Upload backend coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: backend-coverage-lcov
                  path: backend/coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload backend coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: ${{ env.CODECOV_TOKEN_PRESENT == 'true' }}
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  files: backend/coverage/lcov.info
                  flags: backend
                  name: backend
                  fail_ci_if_error: true

    dashboard-static-checks:
        name: dashboard-static-checks
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: greenfield/.bun-version

            - name: Copy the future root into isolation
              run: |
                  mkdir -p "${RUNNER_TEMP}/mira-dashboard-greenfield"
                  cp -a greenfield/. "${RUNNER_TEMP}/mira-dashboard-greenfield/"

            - name: Install isolated dependencies
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun install --frozen-lockfile

            - name: Check isolated source boundaries
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run check:boundaries

            - name: Type-check isolated source and tests
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run typecheck

            - name: Lint isolated source and tests
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run lint

            - name: Check isolated formatting
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run format:check

            - name: Build isolated browser bundle
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run build:browser

            - name: Build isolated process bundles
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run build:processes

            - name: Verify isolated generated documentation
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run docs:check

            - name: Verify isolated migration graph
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run db:check

    dashboard-coverage:
        name: coverage-${{ matrix.partition }}
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                partition: [bun, browser, storybook]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: greenfield/.bun-version

            - name: Copy the future root into isolation
              run: |
                  mkdir -p "${RUNNER_TEMP}/mira-dashboard-greenfield"
                  cp -a greenfield/. "${RUNNER_TEMP}/mira-dashboard-greenfield/"

            - name: Install isolated dependencies
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun install --frozen-lockfile

            - name: Install Chromium
              if: ${{ matrix.partition == 'storybook' }}
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run storybook:install-browser

            - name: Test ${{ matrix.partition }} coverage
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run test:coverage:${{ matrix.partition }}

            - name: Upload ${{ matrix.partition }} coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: dashboard-coverage-${{ matrix.partition }}-lcov
                  path: |
                      ${{ runner.temp }}/mira-dashboard-greenfield/coverage/${{ matrix.partition }}-001/lcov.info
                      ${{ runner.temp }}/mira-dashboard-greenfield/coverage/${{ matrix.partition }}-002/lcov.info
                      ${{ runner.temp }}/mira-dashboard-greenfield/coverage/${{ matrix.partition }}-003/lcov.info
                  if-no-files-found: error
                  retention-days: 14

    dashboard-checks:
        name: dashboard-checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [dashboard-static-checks, dashboard-coverage]
        if: ${{ always() }}
        env:
            CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
        steps:
            - name: Require static checks and every coverage partition
              env:
                  COVERAGE_MATRIX_RESULT: ${{ needs['dashboard-coverage'].result }}
                  STATIC_CHECKS_RESULT: ${{ needs['dashboard-static-checks'].result }}
              run: |
                  test "${STATIC_CHECKS_RESULT}" = "success"
                  test "${COVERAGE_MATRIX_RESULT}" = "success"

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: greenfield/.bun-version

            - name: Copy the future root into isolation
              run: |
                  mkdir -p "${RUNNER_TEMP}/mira-dashboard-greenfield"
                  cp -a greenfield/. "${RUNNER_TEMP}/mira-dashboard-greenfield/"

            - name: Install isolated dependencies
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun install --frozen-lockfile

            - name: Download Bun coverage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dashboard-coverage-bun-lcov
                  path: ${{ runner.temp }}/mira-dashboard-greenfield/coverage

            - name: Download browser coverage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dashboard-coverage-browser-lcov
                  path: ${{ runner.temp }}/mira-dashboard-greenfield/coverage

            - name: Download Storybook coverage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dashboard-coverage-storybook-lcov
                  path: ${{ runner.temp }}/mira-dashboard-greenfield/coverage

            - name: Merge and verify isolated coverage
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run test:coverage:merge

            - name: Prefix isolated LCOV paths for the coexistence checkout
              run: |
                  lcov_path="${RUNNER_TEMP}/mira-dashboard-greenfield/coverage/lcov.info"
                  perl -0pi -e 's{^SF:(?:\./)?(scripts|src)/}{SF:greenfield/$1/}mg' "${lcov_path}"
                  perl -0pi -e 's{^SF:(?:\./)?drizzle\.config\.ts$}{SF:greenfield/drizzle.config.ts}mg' "${lcov_path}"
                  perl -0pi -e 's{^SF:(?:\./)?tailwind\.config\.ts$}{SF:greenfield/tailwind.config.ts}mg' "${lcov_path}"
                  if grep '^SF:' "${lcov_path}" | grep --quiet --invert-match --extended-regexp '^SF:greenfield/((scripts|src)/|(drizzle|tailwind)\.config\.ts$)'; then
                      echo "LCOV contains a source path outside the exact greenfield production inventory" >&2
                      exit 1
                  fi
                  grep --quiet '^SF:greenfield/scripts/' "${lcov_path}"
                  grep --quiet '^SF:greenfield/src/' "${lcov_path}"
                  grep --quiet '^SF:greenfield/drizzle\.config\.ts$' "${lcov_path}"
                  grep --quiet '^SF:greenfield/tailwind\.config\.ts$' "${lcov_path}"

            - name: Upload isolated coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: dashboard-coverage-lcov
                  path: ${{ runner.temp }}/mira-dashboard-greenfield/coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload isolated coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: ${{ env.CODECOV_TOKEN_PRESENT == 'true' }}
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  files: ${{ runner.temp }}/mira-dashboard-greenfield/coverage/lcov.info
                  flags: dashboard
                  name: dashboard
                  fail_ci_if_error: true

    storybook:
        name: storybook
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: greenfield/.bun-version

            - name: Copy the future root into isolation
              run: |
                  mkdir -p "${RUNNER_TEMP}/mira-dashboard-greenfield"
                  cp -a greenfield/. "${RUNNER_TEMP}/mira-dashboard-greenfield/"

            - name: Install isolated dependencies
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun install --frozen-lockfile

            - name: Build Storybook
              working-directory: ${{ runner.temp }}/mira-dashboard-greenfield
              run: bun run build:storybook
