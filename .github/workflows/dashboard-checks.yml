name: Dashboard checks

on:
    pull_request: {}
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    greenfield-foundation:
        name: greenfield-foundation
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pinned Bun revision
              uses: ./.github/actions/setup-qualified-bun

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type-check qualification probes
              run: bun run typecheck:qualification

            - name: Type-check greenfield source
              run: bun run typecheck:greenfield

            - name: Test qualification probes
              run: bun run test:qualification

            - name: Test greenfield source
              run: bun run test:greenfield

            - name: Test documentation generator
              run: bun run test:greenfield:docs

            - name: Verify generated documentation
              run: bun run docs:check

            - name: Verify migration graph
              run: bun run db:check

    drizzle-migration-conflicts:
        name: drizzle-migration-conflicts
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pinned Bun revision
              uses: ./.github/actions/setup-qualified-bun

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check migration conflicts
              uses: drizzle-team/drizzle-orm/actions/check@748058e837d9c4247330e3d45580cbdae52bffda
              with:
                  config: drizzle.config.ts

    frontend-checks:
        name: frontend-checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: ./.github/actions/setup-qualified-bun

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint repository
              run: bun run lint

            - name: Check repository formatting
              run: bun run format:check

            - name: Build frontend
              run: bun run build:frontend

            - name: Test frontend coverage
              run: bun run test:frontend:coverage

            - name: Upload frontend coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: frontend-coverage-lcov
                  path: coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload frontend coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: ${{ env.CODECOV_TOKEN_PRESENT == 'true' }}
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  files: coverage/lcov.info
                  flags: frontend
                  name: frontend
                  fail_ci_if_error: true

    backend-checks:
        name: backend-checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: ./.github/actions/setup-qualified-bun

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build backend
              run: bun run build:backend

            - name: Test backend coverage
              run: bun run test:backend:coverage

            - name: Prefix backend LCOV paths
              if: always()
              run: test ! -f backend/coverage/lcov.info || perl -0pi -e 's{^SF:src/}{SF:backend/src/}mg' backend/coverage/lcov.info

            - name: Upload backend coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: backend-coverage-lcov
                  path: backend/coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload backend coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: ${{ env.CODECOV_TOKEN_PRESENT == 'true' }}
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  files: backend/coverage/lcov.info
                  flags: backend
                  name: backend
                  fail_ci_if_error: true
