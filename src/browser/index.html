<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Mira Dashboard</title>
        <link rel="stylesheet" href="./index.css" />
    </head>
    <body>
        <div id="root">
            <main
                class="bg-primary-900 text-primary-50 flex min-h-screen items-center justify-center px-4"
            >
                <output
                    aria-busy="true"
                    aria-label="Loading Dashboard…"
                    class="text-primary-400 flex w-full flex-col items-center justify-center gap-2 text-sm"
                >
                    <svg
                        aria-hidden="true"
                        class="size-6 animate-spin motion-reduce:animate-none"
                        fill="none"
                        height="24"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                        width="24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                    </svg>
                    <span aria-hidden="true">
                        Loading Dashboard<span
                            class="loading-state-dots inline-block min-w-[1.5em] text-left"
                            ><span class="loading-state-dot inline-block">.</span
                            ><span
                                class="loading-state-dot inline-block animate-[loading-state-second-dot_1.2s_steps(1,end)_infinite] opacity-0 motion-reduce:animate-none motion-reduce:opacity-100"
                                >.</span
                            ><span
                                class="loading-state-dot inline-block animate-[loading-state-third-dot_1.2s_steps(1,end)_infinite] opacity-0 motion-reduce:animate-none motion-reduce:opacity-100"
                                >.</span
                            ></span
                        >
                    </span>
                </output>
            </main>
        </div>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
