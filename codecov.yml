coverage:
    precision: 2
    round: down
    range: 20..85
    status:
        project:
            dashboard:
                target: 85%
                threshold: 0%
                informational: false
                if_ci_failed: error
                if_not_found: failure
                flags:
                    - dashboard
                paths:
                    - greenfield/scripts/
                    - greenfield/src/
                    - greenfield/drizzle.config.ts
                    - greenfield/tailwind.config.ts
            backend:
                target: 85%
                threshold: 0%
                informational: false
                if_ci_failed: error
                flags:
                    - backend
                paths:
                    - backend/src/
            frontend:
                target: 85%
                threshold: 0%
                informational: false
                if_ci_failed: error
                flags:
                    - frontend
                paths:
                    - frontend/src/
        patch:
            dashboard:
                target: 85%
                threshold: 0%
                informational: false
                if_ci_failed: error
                if_not_found: failure
                flags:
                    - dashboard
                paths:
                    - greenfield/scripts/
                    - greenfield/src/
                    - greenfield/drizzle.config.ts
                    - greenfield/tailwind.config.ts
            backend:
                target: 85%
                threshold: 0%
                informational: false
                if_ci_failed: error
                flags:
                    - backend
                paths:
                    - backend/src/
            frontend:
                target: 85%
                threshold: 0%
                informational: false
                if_ci_failed: error
                flags:
                    - frontend
                paths:
                    - frontend/src/

comment:
    layout: "reach,diff,flags,tree"
    behavior: default
    require_changes: false

flags:
    dashboard:
        paths:
            - greenfield/scripts/
            - greenfield/src/
            - greenfield/drizzle.config.ts
            - greenfield/tailwind.config.ts
    frontend:
        paths:
            - frontend/src/
    backend:
        paths:
            - backend/src/
