[install]
peer = false

[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    "backend/dist/**",
    "backend/src/**/*.d.ts",
    "backend/test/**",
    "frontend/src/test/**",
    "frontend/src/**/*.d.ts",
]

[serve.static]
plugins = ["bun-plugin-tailwind", "./scripts/reactCompilerPlugin.ts"]
environment = "PUBLIC_*"
