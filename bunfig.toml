[install]
peer = false

[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    "backend/dist/**",
    "backend/src/**/*.d.ts",
    "backend/test/**",
    "frontend/src/test/**",
    "frontend/src/**/*.d.ts",
]

[serve.static]
plugins = ["./scripts/reactCompilerPlugin.ts", "bun-plugin-tailwind"]
environment = "PUBLIC_*"
